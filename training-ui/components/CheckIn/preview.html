<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><link rel="stylesheet" href="../../tokens.css"><link rel="stylesheet" href="../bundle.css"><script>document.documentElement.dataset.theme=new URLSearchParams(location.search).get("theme")||"dark"</script><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=Unbounded:wght@500;600;700&family=JetBrains+Mono:wght@500&display=swap"></head>
<body>
<div style="padding:var(--space-4)"><section class="ds-card ds-checkin" aria-labelledby="ci-q">
<div class="ds-overline">Before workout</div>
<h3 class="ds-checkin__q" id="ci-q">How do you feel today?</h3>
<div class="ds-checkin__scale" role="group" aria-label="Readiness from 1 to 5"><button class="ds-checkin__pt" aria-pressed="false"><b>1</b>Wrecked</button><button class="ds-checkin__pt" aria-pressed="true"><b>2</b>Tired</button><button class="ds-checkin__pt" aria-pressed="false"><b>3</b>OK</button><button class="ds-checkin__pt" aria-pressed="false"><b>4</b>Good</button><button class="ds-checkin__pt" aria-pressed="false"><b>5</b>Fresh</button></div>
<div class="ds-checkin__opts" role="group" aria-label="What's in the way"><button class="ds-chip" aria-pressed="true">Slept badly</button><button class="ds-chip" aria-pressed="false">Sore</button><button class="ds-chip" aria-pressed="false">Unwell</button><button class="ds-chip" aria-pressed="false">Short on time</button></div>
<button class="ds-btn ds-btn--secondary ds-btn--block">Reply to coach</button>
</section></div>
</body>
</html>
