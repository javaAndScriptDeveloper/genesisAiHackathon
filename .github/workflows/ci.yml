# Fast pipeline: checks and image builds run in parallel, then deploy to the VPS over SSH and verify over HTTP.
name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  VPS_HOST: 37.27.8.181

jobs:
  # Frontend: typecheck + unit tests. No `next build` here: the frontend image build below compiles it anyway.
  frontend-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Typecheck and tests
        working-directory: frontend
        run: bun install --frozen-lockfile && bun run typecheck && bun run test

  backend-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: platform-backend/package-lock.json
      - name: Backend tests (Testcontainers)
        working-directory: platform-backend
        run: npm ci && npm test

  build-backend:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Image prefix (GHCR needs lowercase)
        run: echo "IMAGE_PREFIX=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push platform-backend
        uses: docker/build-push-action@v6
        with:
          context: platform-backend
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/platform-backend:sha-${{ github.sha }}
            ${{ env.IMAGE_PREFIX }}/platform-backend:latest
          cache-from: type=gha,scope=platform-backend
          cache-to: type=gha,scope=platform-backend,mode=max

  build-frontend:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Image prefix (GHCR needs lowercase)
        run: echo "IMAGE_PREFIX=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: frontend
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/frontend:sha-${{ github.sha }}
            ${{ env.IMAGE_PREFIX }}/frontend:latest
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max

  # Runs only when every check and both image builds passed, so a red check never reaches the VPS.
  deploy:
    needs: [frontend-check, backend-test, build-backend, build-frontend]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read # the VPS logs in to GHCR with this token to pull the images
    steps:
      - uses: actions/checkout@v4

      - name: Image prefix (GHCR needs lowercase)
        run: echo "IMAGE_PREFIX=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Deploy over SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
          IMAGE_TAG: sha-${{ github.sha }}
        run: |
          set -euo pipefail
          install -m 600 /dev/null key
          printf '%s\n' "$VPS_SSH_KEY" > key
          SSH="ssh -i key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new root@${VPS_HOST}"
          $SSH 'mkdir -p /opt/app'
          scp -i key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new \
            deploy/compose.prod.yml "root@${VPS_HOST}:/opt/app/compose.prod.yml"
          $SSH "echo '${GHCR_TOKEN}' | docker login ghcr.io -u '${GHCR_USER}' --password-stdin"
          $SSH "umask 077 && printf 'IMAGE_PREFIX=%s\nIMAGE_TAG=%s\nPOSTGRES_PASSWORD=%s\nGEMINI_API_KEY=%s\n' '${IMAGE_PREFIX}' '${IMAGE_TAG}' '${POSTGRES_PASSWORD}' '${GEMINI_API_KEY}' > /opt/app/.env"
          $SSH 'cd /opt/app && docker compose -f compose.prod.yml pull && docker compose -f compose.prod.yml up -d --remove-orphans && docker image prune -f'
          rm -f key

      - name: Verify the VPS answers with a database-backed response
        run: |
          for i in $(seq 1 30); do
            if body=$(curl -fsS "http://${VPS_HOST}/api/health") && echo "$body" | grep -q '"db":true'; then
              echo "OK: $body"; exit 0
            fi
            echo "attempt $i: not ready"; sleep 5
          done
          echo "VPS did not return a healthy response" >&2; exit 1
