# Local dev stack: docker compose up --build  ->  http://localhost:18080
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 3s
      timeout: 3s
      retries: 15

  platform-backend:
    build: ./platform-backend
    environment:
      DATABASE_URL: postgres://app:app@db:5432/app
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "18080:3000"
    environment:
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    depends_on:
      - platform-backend
