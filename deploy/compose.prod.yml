# Production stack on the VPS. CI copies this file to /opt/app and writes .env next to it.
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: app
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 5s
      timeout: 3s
      retries: 15

  platform-backend:
    image: ${IMAGE_PREFIX:?IMAGE_PREFIX is required}/platform-backend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://app:${POSTGRES_PASSWORD}@db:5432/app
    depends_on:
      db:
        condition: service_healthy

  frontend:
    image: ${IMAGE_PREFIX}/frontend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      # Optional: without it goal parsing and voice input answer 503 and the UI says so.
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    ports:
      - "80:3000"
    depends_on:
      - platform-backend

volumes:
  postgres_data:
